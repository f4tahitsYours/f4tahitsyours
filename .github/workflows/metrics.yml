name: GitHub Metrics

on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 WITA setiap hari
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Kartu ringkasan utama: profil, aktivitas, bahasa
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: f4tahitsYours
          filename: assets/metrics-overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Makassar
          config_display: large

      # Kartu bahasa pemrograman
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: f4tahitsYours
          filename: assets/metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          config_timezone: Asia/Makassar

      # Kalender kontribusi setahun penuh
      - name: Calendar card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: f4tahitsYours
          filename: assets/metrics-calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Makassar
