<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="50%" stop-color="#0D1530"/>
      <stop offset="100%" stop-color="#1E0E3E"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="fclip"><rect x="0" y="0" width="1000" height="150" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#fclip)">
    <rect width="1000" height="150" fill="url(#fbg)"/>

    <g>
      <path d="M0 96 C 140 60, 280 132, 420 96 S 700 60, 840 96 S 1120 132, 1260 96 L1260 150 L0 150 Z" fill="url(#w2)">
        <animateTransform attributeName="transform" type="translate" values="0 0; -420 0; 0 0" dur="16s" repeatCount="indefinite"/>
      </path>
      <path d="M0 112 C 140 84, 280 140, 420 112 S 700 84, 840 112 S 1120 140, 1260 112 L1260 150 L0 150 Z" fill="url(#w1)">
        <animateTransform attributeName="transform" type="translate" values="-420 0; 0 0; -420 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="500" y="62" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" letter-spacing="3" fill="#9FB6FF" fill-opacity="0.9">
      thanks for scrolling
    </text>
    <text x="500" y="88" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6F86C4">
      Deep Learning &#183; NLP &#183; Computer Vision
    </text>
  </g>
</svg>
